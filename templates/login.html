{% extends "_auth.html" %}
{% block title %}Sign in - SafeLocate{% endblock %}
{% block form %}
<h2>Sign in</h2>
<form method="post" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email<input type="email" name="email" required autocomplete="email" autofocus></label>
  <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn primary" type="submit">Continue</button>
</form>
<p class="muted">We'll email you a 6-digit code to finish signing in.</p>
<p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
